<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#04050a" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowLeft" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </radialGradient>

    <!-- Typography Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="taglineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Emblem Gradients -->
    <linearGradient id="facetSpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="facetUpperLoop" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="facetLowerLoop" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="60%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0.35" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Card -->
  <rect x="0" y="0" width="1200" height="380" rx="24" fill="url(#bannerBg)" />
  <rect x="0" y="0" width="1200" height="380" rx="24" fill="url(#glowLeft)" />
  <rect x="0" y="0" width="1200" height="380" rx="24" fill="url(#glowRight)" />
  <rect x="0" y="0" width="1200" height="380" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Background Grid Network -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="0" y1="76" x2="1200" y2="76" />
    <line x1="0" y1="152" x2="1200" y2="152" />
    <line x1="0" y1="228" x2="1200" y2="228" />
    <line x1="0" y1="304" x2="1200" y2="304" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="750" y1="0" x2="750" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1050" y1="0" x2="1050" y2="380" />
  </g>

  <!-- Left Side: Large 3D Holographic Emblem (scaled 0.75, offset) -->
  <g transform="translate(110, 60)">
    <!-- Base Glow -->
    <path d="M 50 20 L 140 20 C 180 20 205 45 205 80 C 205 108 190 128 165 135 C 195 145 215 170 215 205 C 215 245 180 268 135 268 L 50 268 Z" 
          fill="none" stroke="#6366F1" stroke-width="32" stroke-opacity="0.2" filter="url(#neon)" />

    <!-- Spine -->
    <rect x="40" y="24" width="44" height="220" rx="22" fill="url(#facetSpine)" />
    <line x1="52" y1="42" x2="52" y2="226" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.4" />

    <!-- Upper Loop -->
    <path d="M 76 24 L 142 24 C 180 24 204 44 204 78 C 204 110 178 128 142 128 L 76 128 Z" fill="url(#facetUpperLoop)" />
    <path d="M 84 56 L 134 56 C 154 56 166 64 166 78 C 166 92 154 98 134 98 L 84 98 Z" fill="#080c16" />

    <!-- Lower Loop -->
    <path d="M 76 120 L 145 120 C 188 120 214 144 214 184 C 214 224 182 248 138 248 L 76 248 Z" fill="url(#facetLowerLoop)" />
    <path d="M 84 152 L 138 152 C 162 152 176 164 176 184 C 176 204 162 216 138 216 L 84 216 Z" fill="#080c16" />

    <!-- Kinetic Arc Stream -->
    <path d="M 18 230 C 26 100 138 20 234 20" 
          fill="none" stroke="url(#facetSpine)" stroke-width="6" stroke-linecap="round" stroke-dasharray="120 30" stroke-opacity="0.85" />

    <!-- Constellation Nodes -->
    <circle cx="234" cy="20" r="8" fill="#00F2FE" filter="url(#neon)" />
    <circle cx="234" cy="20" r="4" fill="#ffffff" />
    <circle cx="18" cy="230" r="7" fill="#34D399" filter="url(#neon)" />
    <circle cx="18" cy="230" r="3.5" fill="#ffffff" />
    <circle cx="214" cy="128" r="6.5" fill="#818CF8" />
  </g>

  <!-- Right Side: Brand Header & Typography -->
  <g transform="translate(420, 115)">
    <!-- Subtitle Pill / Status Tracker -->
    <g transform="translate(0, -35)">
      <rect x="0" y="0" width="280" height="28" rx="14" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#10B981" />
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="11" font-weight="700" letter-spacing="1.5" fill="#38BDF8">
        AUTONOMOUS SOFTWARE STUDIO
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="52" font-weight="900" letter-spacing="-1" fill="url(#textGrad)">
      BASINFY SAAS STUDIO
    </text>

    <!-- Tagline -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="19" font-weight="500" fill="#94A3B8">
      Full-Lifecycle Multi-Agent Engineering Architecture for Modern SaaS
    </text>

    <!-- Feature Badges Flow -->
    <g transform="translate(0, 125)">
      <!-- Badge 1: 49 Agents -->
      <g>
        <rect x="0" y="0" width="168" height="36" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
          👔 49 Specialized Agents
        </text>
      </g>

      <!-- Badge 2: 74 Workflows -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="164" height="36" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
          ⚡ 74 Workflows (/saas-*)
        </text>
      </g>

      <!-- Badge 3: 28 Director Gates -->
      <g transform="translate(356, 0)">
        <rect x="0" y="0" width="162" height="36" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
          🛡️ 28 Director Gates
        </text>
      </g>

      <!-- Badge 4: Multi-Stack -->
      <g transform="translate(530, 0)">
        <rect x="0" y="0" width="176" height="36" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
          🐍 Python • Go • Next.js
        </text>
      </g>
    </g>
  </g>
</svg>
