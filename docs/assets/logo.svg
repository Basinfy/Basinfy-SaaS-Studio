<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101c" />
      <stop offset="50%" stop-color="#080b14" />
      <stop offset="100%" stop-color="#04050a" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <radialGradient id="ambientCyan" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientPurple" cx="70%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </radialGradient>

    <!-- Ribbon Gradients for the Dimensional 'B' -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="facetSpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="facetUpperLoop" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="facetLowerLoop" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="60%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>

    <linearGradient id="facetInnerShadow" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowMain" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Glassmorphism Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#ambientCyan)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#ambientPurple)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Geometric Grid Accent Overlay (Micro-Circuit Studio Grid) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="80" y1="16" x2="80" y2="496" />
    <line x1="160" y1="16" x2="160" y2="496" />
    <line x1="256" y1="16" x2="256" y2="496" />
    <line x1="352" y1="16" x2="352" y2="496" />
    <line x1="432" y1="16" x2="432" y2="496" />
    <line x1="16" y1="80" x2="496" y2="80" />
    <line x1="16" y1="160" x2="496" y2="160" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <line x1="16" y1="352" x2="496" y2="352" />
    <line x1="16" y1="432" x2="496" y2="432" />
  </g>

  <!-- Central Emblem: The Multi-Layered 'B' Basinfy Monogram -->
  <g filter="url(#shadowMain)">
    <!-- Base Glow behind the emblem -->
    <path d="M 160 110 L 280 110 C 330 110 365 140 365 185 C 365 218 345 242 315 252 C 355 264 380 295 380 338 C 380 390 335 418 280 418 L 160 418 Z" 
          fill="none" stroke="#6366F1" stroke-width="40" stroke-opacity="0.15" filter="url(#neonGlow)" />

    <!-- 1. The Strong Vertical Spine with Conduit Flow -->
    <rect x="148" y="118" width="56" height="276" rx="28" fill="url(#facetSpine)" />
    
    <!-- Spine Light Beam Inner Highlight -->
    <line x1="164" y1="140" x2="164" y2="372" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4" />

    <!-- 2. Upper Architectural Basin / Loop -->
    <path d="M 194 118 
             L 282 118 
             C 328 118 358 142 358 184 
             C 358 224 326 248 282 248 
             L 194 248 
             Z" 
          fill="url(#facetUpperLoop)" />
    
    <!-- Upper Negative Space (Hole) -->
    <path d="M 204 158 
             L 272 158 
             C 296 158 312 168 312 184 
             C 312 200 296 208 272 208 
             L 204 208 
             Z" 
          fill="#080c16" />

    <!-- 3. Lower Expanding Basin / Loop -->
    <path d="M 194 238 
             L 286 238 
             C 338 238 372 268 372 318 
             C 372 368 332 398 278 398 
             L 194 398 
             Z" 
          fill="url(#facetLowerLoop)" />

    <!-- Lower Negative Space (Hole) -->
    <path d="M 204 278 
             L 274 278 
             C 304 278 324 292 324 318 
             C 324 344 304 358 274 358 
             L 204 358 
             Z" 
          fill="#080c16" />

    <!-- Isometric Top Facet (Depth Layer) -->
    <polygon points="148,118 176,96 304,96 282,118" fill="url(#facetTop)" fill-opacity="0.9" />

    <!-- Intersecting Kinetic Energy Arc (The Basinfy Vector Stream) -->
    <path d="M 120 380 C 130 220 270 120 390 120" 
          fill="none" stroke="url(#facetSpine)" stroke-width="8" stroke-linecap="round" stroke-dasharray="160 40" stroke-opacity="0.8" />
    
    <!-- Autonomous Agent Constellation Nodes (Connected Intelligence) -->
    <!-- Node 1: Tier 1 Strategic (Top Right) -->
    <circle cx="390" cy="120" r="10" fill="#00F2FE" filter="url(#neonGlow)" />
    <circle cx="390" cy="120" r="5" fill="#ffffff" />
    
    <!-- Node 2: Tier 2 Orchestration (Middle) -->
    <circle cx="372" cy="248" r="9" fill="#818CF8" />
    <circle cx="372" cy="248" r="4.5" fill="#ffffff" />

    <!-- Node 3: Tier 3 Engineering (Bottom Left Accent) -->
    <circle cx="120" cy="380" r="10" fill="#34D399" filter="url(#neonGlow)" />
    <circle cx="120" cy="380" r="5" fill="#ffffff" />

    <!-- Small Core Synapse Rings -->
    <circle cx="272" cy="184" r="3" fill="#38BDF8" />
    <circle cx="274" cy="318" r="3.5" fill="#F472B6" />
  </g>

  <!-- High-Tech Studio Badge Footer Subtext -->
  <g transform="translate(256, 456)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="12" font-weight="700" letter-spacing="6" fill="#94A3B8" fill-opacity="0.6">
      BASINFY SAAS STUDIO
    </text>
  </g>
</svg>
